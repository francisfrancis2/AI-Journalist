version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: aijournalist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aijournalist
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: aijournalist
    expose:
      - "5432"
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijournalist -d aijournalist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aijournalist-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Local Docker should always use the bundled Postgres container.
      # This overrides DATABASE_URL from .env so Neon is not required locally.
      DATABASE_URL: postgresql://aijournalist:secret@db:5432/aijournalist
    # No host port mapping — backend is only reachable within the internal network
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      # Optional: mount YouTube cookies to bypass transcript rate limits in Docker.
      # Export from browser as Netscape format, save to ./youtube_cookies.txt, then set
      # YOUTUBE_COOKIES_PATH=/app/youtube_cookies.txt in your .env file.
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: aijournalist-frontend
    restart: unless-stopped
    environment:
      # Empty string → api.ts uses relative URLs → Next.js rewrites proxy to backend
      NEXT_PUBLIC_API_URL: ""
      # Server-side proxy target (used by next.config.ts rewrites, never exposed to browser)
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    networks:
      - internal
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
