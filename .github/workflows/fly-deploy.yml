name: Deploy to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    concurrency: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deployment secrets
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          required_secrets=(
            FLY_API_TOKEN
            ANTHROPIC_API_KEY
            TAVILY_API_KEY
            NEWS_API_KEY
            ALPHA_VANTAGE_API_KEY
            DATABASE_URL
            JWT_SECRET_KEY
            ADMIN_EMAIL
            ADMIN_PASSWORD
          )

          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::Missing required GitHub secrets: ${missing_secrets[*]}"
            exit 1
          fi

          if [[ "$DATABASE_URL" == *"localhost"* || "$DATABASE_URL" == *"127.0.0.1"* || "$DATABASE_URL" == *"@db:"* ]]; then
            echo "::error::DATABASE_URL points to a local database. Use the hosted production Postgres URL for Fly."
            exit 1
          fi

      - name: Create app if it does not exist
        run: flyctl apps create aijournalist-backend --machines 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set secrets
        run: |
          flyctl secrets set \
            --app aijournalist-backend \
            --stage \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            TAVILY_API_KEY="${{ secrets.TAVILY_API_KEY }}" \
            NEWS_API_KEY="${{ secrets.NEWS_API_KEY }}" \
            ALPHA_VANTAGE_API_KEY="${{ secrets.ALPHA_VANTAGE_API_KEY }}" \
            YOUTUBE_API_KEY="${{ secrets.YOUTUBE_API_KEY }}" \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            AWS_ACCESS_KEY_ID="test" \
            AWS_SECRET_ACCESS_KEY="test" \
            CORS_ORIGINS="https://aijournalist-frontend.fly.dev" \
            TRUSTED_HOSTS="aijournalist-backend.fly.dev,aijournalist-backend.internal"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --app aijournalist-backend --config fly.backend.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test backend
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            if curl -fsS --max-time 10 https://aijournalist-backend.fly.dev/health; then
              exit 0
            fi
            echo "Backend health check failed on attempt ${attempt}; retrying..."
            sleep 10
          done

          echo "::error::Backend did not return a healthy /health response after deploy."
          exit 1

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    concurrency: deploy-frontend
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it does not exist
        run: flyctl apps create aijournalist-frontend --machines 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --app aijournalist-frontend --config fly.frontend.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test frontend
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            if curl -fsS --max-time 10 https://aijournalist-frontend.fly.dev/; then
              exit 0
            fi
            echo "Frontend health check failed on attempt ${attempt}; retrying..."
            sleep 10
          done

          echo "::error::Frontend did not return a healthy response after deploy."
          exit 1
