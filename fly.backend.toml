app = "aijournalist-backend"
primary_region = "sin"  # Singapore — closest to Neon ap-southeast-1

# Give in-flight pipelines up to 10 minutes to finish on SIGTERM before Fly
# escalates to SIGKILL. Without this (Fly's default is 5s) every redeploy
# orphans any running scriptwriter call, leaving stories stuck mid-pipeline.
kill_signal  = "SIGTERM"
kill_timeout = "600s"

[build]
  dockerfile = "backend/Dockerfile"
  # Build context is the repo root (alembic.ini lives there)
  build_target = ""

[env]
  PYTHONPATH       = "/app"
  AWS_REGION       = "us-east-1"
  S3_BUCKET_SCRIPTS = "ai-journalist-scripts"
  S3_BUCKET_ASSETS  = "ai-journalist-assets"
  LOG_LEVEL        = "INFO"
  DEBUG            = "false"
  CORS_ORIGINS     = "https://aijournalist-frontend.fly.dev"
  TRUSTED_HOSTS    = "aijournalist-backend.fly.dev,aijournalist-backend.internal,localhost,127.0.0.1,backend,*.localhost"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    grace_period  = "120s"
    interval      = "30s"
    method        = "GET"
    timeout       = "10s"
    path          = "/health"

[[vm]]
  size   = "performance-2x"   # 4 GB RAM — Playwright requires it
  memory = "4096"
