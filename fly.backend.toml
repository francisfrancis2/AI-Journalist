app = "aijournalist-backend"
primary_region = "sin"  # Singapore — closest to Neon ap-southeast-1

# Give in-flight pipelines up to 5 minutes to finish on SIGTERM before Fly
# escalates to SIGKILL. 5 minutes is Fly's hard cap on stop_config.timeout;
# without this (default 5s) every redeploy orphans any running scriptwriter
# call. The stale-pipeline watchdog handles anything that exceeds the cap.
kill_signal  = "SIGTERM"
kill_timeout = "300s"

[build]
  dockerfile = "backend/Dockerfile"
  # Build context is the repo root (alembic.ini lives there)
  build_target = ""

[env]
  PYTHONPATH       = "/app"
  LOG_LEVEL        = "INFO"
  DEBUG            = "false"
  CORS_ORIGINS     = "https://aijournalist-frontend.fly.dev"
  TRUSTED_HOSTS    = "aijournalist-backend.fly.dev,aijournalist-backend.internal,localhost,127.0.0.1,backend,*.localhost"

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["app"]

  [[http_service.checks]]
    grace_period  = "120s"
    interval      = "30s"
    method        = "GET"
    timeout       = "10s"
    path          = "/health"

[[vm]]
  size   = "performance-2x"   # 4 GB RAM — Playwright requires it
  memory = "4096"
